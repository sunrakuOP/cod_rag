services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cod_rag
      POSTGRES_PASSWORD: cod_rag
      POSTGRES_DB: cod_rag
    ports:
      - "5432:5432"
    volumes:
      - cod_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cod_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cod_rag_pgdata:
